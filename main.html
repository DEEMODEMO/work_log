<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ажлын Тэмдэглэл</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        
        html, body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at 10% 20%, rgba(121, 40, 202, 0.6) 0%, transparent 40%),
                        radial-gradient(circle at 90% 80%, rgba(255, 0, 128, 0.5) 0%, transparent 40%),
                        radial-gradient(circle at 50% 50%, rgba(14, 125, 248, 0.5) 0%, transparent 50%),
                        linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            background-attachment: fixed;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        /* Баруун дээд буланд он, сар, өдөр, цагийг хамт харуулах хэсэг */
        .floating-clock {
            position: fixed;
            top: 15px;
            right: 15px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(47, 245, 202, 0.4);
            padding: 8px 14px;
            border-radius: 12px;
            z-index: 9999;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            text-align: right;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
            margin-top: 40px;
            margin-bottom: 40px;
        }
        
        .custom-btn {
            color: #fff !important;
            font-size: 15px !important;
            font-weight: 700 !important;
            box-shadow: 4px 4px 0px -1px #0adabe, 4px 4px 0px 1px #000 !important;
            padding: 12px 18px !important;
            border-radius: 12px !important;
            border: 2px solid #000 !important;
            background: radial-gradient(circle at top right, #2ff5ca, #0e7df8) !important;
            cursor: pointer !important;
            transition: 0.3s ease !important;
            width: 100% !important;
            white-space: pre-wrap !important;
            text-align: left !important;
            line-height: 1.5 !important;
            margin-bottom: 12px;
        }
        
        .custom-btn:hover {
            transform: translate(-.1em, -.1em) !important;
            box-shadow: 7px 7px 0px -1px #0e7df8, 7px 7px 0px 1px #000 !important;
        }

        .nav-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .nav-btn {
            flex: 1;
            text-align: center !important;
            padding: 10px !important;
            font-size: 14px !important;
        }

        .summary-box {
            padding: 22px;
            border-radius: 16px;
            background: rgba(15, 23, 42, 0.9);
            border: 2px solid #ff0080;
            color: #f8fafc;
            margin-top: 10px;
            box-shadow: 6px 6px 0px #ff0080;
            font-size: 15px;
            line-height: 1.6;
            white-space: pre-wrap;
        }
        
        textarea, select {
            width: 100%;
            background-color: rgba(15, 23, 42, 0.9) !important;
            color: #f8fafc !important;
            border: 2px solid #0adabe !important;
            border-radius: 12px !important;
            padding: 12px;
            font-size: 15px;
            resize: vertical;
            margin-bottom: 10px;
        }

        h2, h4 {
            color: #2ff5ca;
            text-align: center;
            font-weight: 800;
        }

        p {
            text-align: center;
            color: #cbd5e1;
            font-size: 14px;
        }

        hr {
            border: 0;
            height: 1px;
            background: rgba(255, 255, 255, 0.2);
            margin: 20px 0;
        }

        .action-row {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }
        
        .action-row button {
            flex: 1;
        }

        .edit-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #2ff5ca;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <!-- Баруун дээд булангийн байнгын цаг болон огноо -->
    <div class="floating-clock">
        <div style="font-size: 10px; color: #2ff5ca; font-weight: 700; text-transform: uppercase;">🟢 УБ Цаг</div>
        <div id="live-clock" style="font-size: 12px; font-weight: 800; color: #ffffff;">Ачааллаж байна...</div>
    </div>

    <div class="container">
        <h2>Ажлын Тэмдэглэл & Тайлан</h2>
        <p>Өдрийн ажлаа бүртгээд тайлангаа хялбархан нэгтгээрэй.</p>
        <hr>

        <!-- Навигаци -->
        <div class="nav-container">
            <button class="custom-btn nav-btn" onclick="switchPage('burtgeh')">📝 Бүртгэх</button>
            <button class="custom-btn nav-btn" onclick="switchPage('negtgel')">📊 Нэгтгэл</button>
            <button class="custom-btn nav-btn" onclick="switchPage('archiv')">📚 Архив</button>
        </div>

        <!-- ХУУДАС 1: БҮРТГЭХ -->
        <div id="page-burtgeh" class="page-content">
            <h4>Шинэ ажил нэмэх</h4>
            <textarea id="taskInput" placeholder="Жишээ нь: Тайлан шалгаж дуусгалаа..." rows="3"></textarea>
            <button class="custom-btn" onclick="addTask()">Бүртгэх</button>

            <h4 id="todayTitle" style="margin-top: 30px; text-align: left;">Өнөөдрийн тэмдэглэл</h4>
            <p style="text-align: left; font-size: 13px; color: #94a3b8;">💡 Засах эсвэл устгахын тулд тухайн ажил дээр дарна уу.</p>
            <div id="todayLogsList"></div>
        </div>

        <!-- ХУУДАС 2: НЭГТГЭЛ -->
        <div id="page-negtgel" class="page-content" style="display: none;">
            <h4>Ажлын тайлан нэгтгэх</h4>
            <button class="custom-btn" onclick="generateAIReport()">✨ Тайлангийн хувилбарууд үүсгэх</button>
            <div id="aiReportContainer" style="margin-top: 20px;"></div>
        </div>

        <!-- ХУУДАС 3: АРХИВ -->
        <div id="page-archiv" class="page-content" style="display: none;">
            <h4>Өмнөх өдрүүдийн архив</h4>
            <select id="archiveDateSelect" onchange="loadArchiveData()"></select>
            <div id="archiveContent"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB2LYbmTMVQI6h1nOJH--I22CDT1IGIhWs",
            authDomain: "ajil-burtgeh.firebaseapp.com",
            projectId: "ajil-burtgeh",
            storageBucket: "ajil-burtgeh.firebasestorage.app",
            messagingSenderId: "207124637042",
            appId: "1:207124637042:web:861e12d66a5bbcdc79a9eb",
            measurementId: "G-Q2N2Q6NYE5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Он, сар, өдөр болон цагийг хамт гаргах функц
        function updateClock() {
            const options = { timeZone: 'Asia/Ulaanbaatar', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
            const formatter = new Intl.DateTimeFormat([], options);
            const parts = formatter.formatToParts(new Date());
            let year, month, day, hour, minute, second;
            for (let p of parts) {
                if (p.type === 'year') year = p.value;
                if (p.type === 'month') month = p.value;
                if (p.type === 'day') day = p.value;
                if (p.type === 'hour') hour = p.value;
                if (p.type === 'minute') minute = p.value;
                if (p.type === 'second') second = p.value;
            }
            const elem = document.getElementById('live-clock');
            if (elem) {
                elem.innerText = `${year}.${month}.${day} ${hour}:${minute}:${second}`;
            }
        }
        setInterval(updateClock, 1000);
        updateClock();

        function getTodayStr() {
            const options = { timeZone: 'Asia/Ulaanbaatar', year: 'numeric', month: '2-digit', day: '2-digit' };
            const formatter = new Intl.DateTimeFormat('en-CA', options);
            return formatter.format(new Date());
        }

        const todayStr = getTodayStr();
        const titleEl = document.getElementById("todayTitle");
        if (titleEl) {
            titleEl.innerText = `Өнөөдрийн тэмдэглэл (${todayStr})`;
        }

        window.appData = {};
        window.currentEditingId = null;

        async function loadAllData() {
            try {
                const docRef = doc(db, "work_logs", "user_data");
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    window.appData = docSnap.data();
                } else {
                    window.appData = {};
                }
            } catch (e) {
                console.error("Firebase холболтын алдаа: ", e);
                window.appData = {};
            }
            renderTodayLogs();
            loadArchiveDropdown();
        }

        async function saveDataToFirebase() {
            try {
                await setDoc(doc(db, "work_logs", "user_data"), window.appData);
            } catch (e) {
                console.error("Хадгалахад алдаа гарлаа: ", e);
            }
        }

        window.switchPage = function(pageName) {
            document.getElementById("page-burtgeh").style.display = pageName === 'burtgeh' ? 'block' : 'none';
            document.getElementById("page-negtgel").style.display = pageName === 'negtgel' ? 'block' : 'none';
            document.getElementById("page-archiv").style.display = pageName === 'archiv' ? 'block' : 'none';
            if (pageName === 'archiv') loadArchiveDropdown();
        }

        window.addTask = async function() {
            const textInput = document.getElementById("taskInput");
            const text = textInput.value.trim();
            if (!text) return alert("Ажлын утгаа оруулна уу!");

            const timeOptions = { timeZone: 'Asia/Ulaanbaatar', hour: '2-digit', minute: '2-digit', hour12: false };
            const timeStr = new Intl.DateTimeFormat([], timeOptions).format(new Date());

            if (!window.appData[todayStr]) {
                window.appData[todayStr] = { logs: [], summary: "" };
            }

            const newId = "log_" + Date.now();
            window.appData[todayStr].logs.push({ id: newId, time: timeStr, text: text });

            renderTodayLogs(); 
            textInput.value = "";
            await saveDataToFirebase(); 
        }

        function renderTodayLogs() {
            const container = document.getElementById("todayLogsList");
            if (!container) return;
            container.innerHTML = "";

            const dayData = window.appData[todayStr];
            if (!dayData || !dayData.logs || dayData.logs.length === 0) {
                container.innerHTML = "<p style='text-align: center; color: #94a3b8; margin-top: 20px;'>Өнөөдөр одоогоор бүртгэсэн ажил алга.</p>";
                return;
            }

            dayData.logs.forEach(item => {
                if (window.currentEditingId === item.id) {
                    const editDiv = document.createElement("div");
                    editDiv.className = "edit-box";
                    editDiv.innerHTML = `
                        <p style="text-align: left; margin: 0 0 5px 0;">🕒 ${item.time} - Засварлах</p>
                        <textarea id="edit_text_${item.id}" rows="2">${item.text}</textarea>
                        <div class="action-row">
                            <button class="custom-btn" onclick="saveEdit('${item.id}', '${todayStr}')">💾 Хадгалах</button>
                            <button class="custom-btn" style="background: radial-gradient(circle at top right, #ff5c5c, #d32f2f) !important; box-shadow: 4px 4px 0px -1px #ff0000, 4px 4px 0px 1px #000 !important;" onclick="deleteTask('${item.id}', '${todayStr}')">🗑️ Устгах</button>
                            <button class="custom-btn" style="background: radial-gradient(circle at top right, #888, #444) !important; box-shadow: 4px 4px 0px -1px #222, 4px 4px 0px 1px #000 !important;" onclick="cancelEdit()">❌ Болих</button>
                        </div>
                    `;
                    container.appendChild(editDiv);
                } else {
                    const btn = document.createElement("button");
                    btn.className = "custom-btn";
                    btn.innerHTML = `🕒 ${item.time}<br><br>${item.text}`;
                    btn.onclick = () => {
                        window.currentEditingId = item.id;
                        renderTodayLogs();
                    };
                    container.appendChild(btn);
                }
            });
        }

        window.cancelEdit = function() {
            window.currentEditingId = null;
            renderTodayLogs();
        }

        window.saveEdit = async function(id, dateKey) {
            const editTextEl = document.getElementById(`edit_text_${id}`);
            if (!editTextEl) return;
            const updatedText = editTextEl.value;
            const logs = window.appData[dateKey].logs;
            const item = logs.find(x => x.id === id);
            if (item) {
                item.text = updatedText;
                window.currentEditingId = null;
                renderTodayLogs();
                await saveDataToFirebase();
            }
        }

        window.deleteTask = async function(id, dateKey) {
            if (confirm("Энэ тэмдэглэлийг устгахдаа итгэлтэй байна уу?")) {
                window.appData[dateKey].logs = window.appData[dateKey].logs.filter(x => x.id !== id);
                window.currentEditingId = null;
                renderTodayLogs();
                await saveDataToFirebase();
            }
        }

        window.generateAIReport = function() {
            const dayData = window.appData[todayStr];
            if (!dayData || !dayData.logs || dayData.logs.length === 0) {
                alert("Нэгтгэх ажил одоогоор бүртгэгдээгүй байна.");
                return;
            }

            const container = document.getElementById("aiReportContainer");
            container.innerHTML = "<p>Боловсруулж байна...</p>";

            let logsText = "";
            dayData.logs.forEach(l => logsText += `- ${l.text}\n`);

            setTimeout(() => {
                const options = [
                    `Цэгцтэй гол санаа:\n${logsText}`,
                    `Албан ёсны тайлан:\nӨнөөдрийн байдлаар дараах ажлуудыг хийж гүйцэтгэлээ:\n${logsText}`,
                    `Цулгуй өгүүлбэр:\nӨнөөдөр хийсэн ажлуудын хүрээнд ${dayData.logs.map(l => l.text).join(", ").toLowerCase()} зэрэг ажлуудыг амжилттай амжууллаа.`
                ];

                let html = `<p style='color: #2ff5ca; font-weight: 700;'>📌 Хувилбар сонгох:</p>`;
                options.forEach((opt, idx) => {
                    html += `
                        <div style="margin-bottom: 15px;">
                            <button class="custom-btn" onclick="saveSummary(${idx})">Хувилбар #${idx + 1}-ийг сонгож хадгалах</button>
                            <div class="summary-box" style="margin-top: 5px;">${opt}</div>
                        </div>
                    `;
                });
                window.tempOptions = options;
                container.innerHTML = html;
            }, 1000);
        }

        window.saveSummary = async function(idx) {
            const summaryText = window.tempOptions[idx];
            if (!window.appData[todayStr]) window.appData[todayStr] = { logs: [], summary: "" };
            window.appData[todayStr].summary = summaryText;
            await saveDataToFirebase();
            alert("Амжилттай Архив руу хадгалагдлаа!");
            window.switchPage('archiv');
        }

        function loadArchiveDropdown() {
            const select = document.getElementById("archiveDateSelect");
            if (!select) return;
            select.innerHTML = "";
            const dates = Object.keys(window.appData).sort().reverse();
            
            if (dates.length === 0) {
                select.innerHTML = "<option>Архив хоосон байна</option>";
                document.getElementById("archiveContent").innerHTML = "";
                return;
            }

            dates.forEach(d => {
                const opt = document.createElement("option");
                opt.value = d;
                opt.innerText = d;
                select.appendChild(opt);
            });
            loadArchiveData();
        }

        window.loadArchiveData = function() {
            const select = document.getElementById("archiveDateSelect");
            if (!select) return;
            const selectedDate = select.value;
            const contentContainer = document.getElementById("archiveContent");

            if (!selectedDate || !window.appData[selectedDate]) {
                contentContainer.innerHTML = "";
                return;
            }

            const data = window.appData[selectedDate];
            let html = "";
            if (data && data.summary) {
                html += `<p style="text-align:left; margin-top:15px;"><strong>${selectedDate} өдрийн хураангуй:</strong></p>`;
                html += `<div class="summary-box">${data.summary}</div>`;
            } else {
                html += `<p style="text-align:left; margin-top:15px; color: #94a3b8;">Энэ өдөр тайлан хадгалаагүй байна.</p>`;
            }

            contentContainer.innerHTML = html;
        }

        loadAllData();
    </script>
</body>
</html>
